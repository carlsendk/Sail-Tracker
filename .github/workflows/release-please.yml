name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      # release-please opens its PR using this token. We use a PAT
      # (RELEASE_PAT) instead of the default GITHUB_TOKEN so the resulting
      # `pull_request` event triggers downstream workflows (notably ci.yml's
      # `validate` job, which is required by branch protection). Events
      # produced by the default GITHUB_TOKEN are deliberately suppressed by
      # GitHub to prevent recursive workflow loops, which would otherwise
      # leave release PRs in `mergeStateStatus: BLOCKED` forever with no
      # status checks reported.
      #
      # Setup required: create a fine-grained PAT with `contents: write` and
      # `pull_requests: write` on this repo, store it as `RELEASE_PAT` in
      # repository secrets.
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: .release-please-config.json
          manifest-file: release-please-manifest.json

      - name: Enable auto-merge on release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          pr_number=$(jq -r '.number' <<<"$PR_JSON")
          gh pr merge --auto --squash "$pr_number" --repo "$GITHUB_REPOSITORY"
